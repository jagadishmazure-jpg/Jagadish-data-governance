[project]
name = "datagov"
version = "0.1.0"
description = "Unity Catalog-style data governance: catalog, RBAC, PII masking, lineage, audit"
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datagov"]
